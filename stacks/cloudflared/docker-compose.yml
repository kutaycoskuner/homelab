# cloudflared: Cloudflare Tunnel connector, publishes chosen services under your domain without open ports. See README.md.
# Portainer: set CLOUDFLARE_TUNNEL_TOKEN under Environment variables. CLI: put it in .env (see .env.example).
services:
  cloudflared:
    image: cloudflare/cloudflared:2026.10.3   # pinned; 2026.10.2+ required by Cloudflare's security notice (Oct 2026); Renovate proposes updates (docs/updates.md)
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}   # secret; read from the environment, not the command line

x-ci:   # CI options, see docs/ci.md
  smoke: false   # needs a real tunnel token
