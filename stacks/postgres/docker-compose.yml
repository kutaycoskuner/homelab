# postgres: one shared PostgreSQL database server for own apps, plus pgAdmin as its web UI. See README.md.
# Portainer: set the keys from .env.example under Environment variables. CLI: put them in .env.
services:
  postgres:
    image: postgres:17@sha256:3b0cda93be7c8dba2ed484d19393d93845dc3dafb88973e248ba8e6d99d784e1
    container_name: postgres-core
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}             # admin user, created on the first start only
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}     # secret
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"   # home network and Tailscale only; never publish through the tunnel
    networks:
      - db_network

  pgadmin:
    image: dpage/pgadmin4:latest@sha256:3591b3d02910dcd817dec6fcaa681c278ba6966945283dd0ea0042731c330c83
    container_name: pgadmin-core
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}         # pgAdmin login
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}   # secret
    volumes:
      - pgadmin_data:/var/lib/pgadmin   # saved servers and settings survive updates
    ports:
      - "5050:80"
    networks:
      - db_network

# fixed names (from .env.example), so a redeploy finds the same data, and app stacks (umami, backup, ...)
# can join the network as an external one; an existing install keeps its own names here
volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME}
  pgadmin_data:
    name: ${PGADMIN_VOLUME_NAME}

networks:
  db_network:
    name: ${POSTGRES_NETWORK}
