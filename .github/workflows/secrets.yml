# Scans the repo and its full history for secrets that should only live in local .env / config.yaml files (docs/secrets-and-examples.md).
name: secrets

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history, so secrets in old commits are found too
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  webhooks:
    # gitleaks has no rule for Discord webhook URLs; placeholders use <id>/<token>, so only real ones match
    # -l prints file names only, so the URL itself never appears in the CI log
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          if git grep -lE 'discord(app)?\.com/api/webhooks/[0-9]+/'; then
            echo "::error::real Discord webhook URL committed; move it to .env (docs/secrets-and-examples.md)"
            exit 1
          fi
