# umami: self-hosted website analytics, stored in the shared postgres stack. See README.md.
# Needs stacks/postgres running (database, user and the db_network). Variables: see .env.example.
services:
  umami:
    image: ghcr.io/umami-software/umami:latest@sha256:e69d1a7932e9dab0fc523edc7be1f3a53f3c261f57856fc2167ae74a8fc022e8
    container_name: umami
    restart: unless-stopped
    environment:
      # secret: the connection string holds the database password
      DATABASE_URL: postgresql://${UMAMI_DB_USER}:${UMAMI_DB_PASSWORD}@postgres-core:5432/${UMAMI_DB_NAME}
      APP_SECRET: ${UMAMI_APP_SECRET}   # secret: signs login sessions
    ports:
      - "3001:3000"
    networks:
      - db_network

networks:
  db_network:
    external: true
    name: db_network   # created by stacks/postgres

x-ci:   # CI options, see docs/ci.md
  smoke: false   # needs the postgres stack's database and network
