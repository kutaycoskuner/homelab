# Loads every dashboard JSON in /etc/grafana/dashboards (copied from ../../dashboards) into the folder
# "Homelab". Edits in the UI can't be saved: change the JSON file here instead.
apiVersion: 1
providers:
  - name: homelab
    folder: Homelab
    type: file
    disableDeletion: true
    allowUiUpdates: false
    options:
      path: /etc/grafana/dashboards
