# monitoring: checks that the sites answer and posts to Discord when one fails; everything is configured
# as code in this folder. blackbox checks, Prometheus collects and evaluates the alert rules,
# Alertmanager sends the alerts, Grafana draws the dashboards. The config files are copied into images built on the server, because
# Portainer CE can't mount files from a Git stack. Variables: see .env.example. See docs/monitoring.md.
services:
  blackbox:
    build: ./blackbox
    image: homelab-monitoring-blackbox
    pull_policy: build   # built on the server from ./blackbox, never downloaded
    container_name: monitoring-blackbox
    restart: unless-stopped
    # no port on the server: only Prometheus asks it, inside this stack's network

  prometheus:
    build: ./prometheus
    image: homelab-monitoring-prometheus
    pull_policy: build
    container_name: monitoring-prometheus
    restart: unless-stopped
    environment:
      PROBE_TARGETS: ${PROBE_TARGETS}   # the URLs to check, comma-separated
    ports:
      - "9090:9090"   # Prometheus' page: current checks and alerts (read-only), through Tailscale
    volumes:
      - prometheus_data:/prometheus   # 15 days of results
    depends_on:
      - blackbox
      - alertmanager

  alertmanager:
    build: ./alertmanager
    image: homelab-monitoring-alertmanager
    pull_policy: build
    container_name: monitoring-alertmanager
    restart: unless-stopped
    environment:
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL}   # secret: anyone with it can post to the channel
    ports:
      - "9093:9093"   # Alertmanager's page: alerts being sent (read-only), through Tailscale
    volumes:
      - alertmanager_data:/alertmanager   # remembers what was already sent, across restarts

  # the server's own numbers (CPU, RAM, temperature, disk) and values other stacks write as small
  # files into backup-status, e.g. the backup's last successful run
  node-exporter:
    image: prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    container_name: monitoring-node-exporter
    restart: unless-stopped
    pid: host   # sees the server's processes, not only its own
    command:
      - --path.rootfs=/host
      - --collector.textfile.directory=/textfile
    volumes:
      - /:/host:ro,rslave              # the server's system, read-only
      - backup-status:/textfile:ro     # *.prom files written by other stacks
    # no port on the server: only Prometheus asks it, inside this stack's network

  # dashboards: graphs of what Prometheus stores; data source and dashboards are files in ./grafana
  grafana:
    build: ./grafana
    image: homelab-monitoring-grafana
    pull_policy: build
    container_name: monitoring-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}   # secret; used only on the very first start, see docs/monitoring.md
      GF_USERS_ALLOW_SIGN_UP: "false"            # no new accounts from the login page
      GF_AUTH_ANONYMOUS_ENABLED: "false"         # nothing without a login
      GF_ANALYTICS_REPORTING_ENABLED: "false"    # no usage statistics sent to Grafana Labs
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"    # updates come as Renovate pull requests
    ports:
      - "3010:3000"   # Grafana's page, through Tailscale; 3000 on the server is AdGuard's setup page
    volumes:
      - grafana_data:/var/lib/grafana   # users, preferences; the dashboards themselves come from the image
    depends_on:
      - prometheus

volumes:
  prometheus_data:
  alertmanager_data:
  grafana_data:
  backup-status:
    name: backup-status   # fixed name: the backup stack mounts it as an external volume

x-ci:   # CI options, see docs/ci.md
  url: http://localhost:9090/-/ready
