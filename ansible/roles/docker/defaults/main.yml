# the same packages scripts/server_base installs and updates
docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-compose-plugin
  - docker-buildx-plugin

# users that may run docker without sudo; default: the user Ansible logs in with
docker_users:
  - "{{ ansible_user }}"

# Docker's repository per system: debian for Raspberry Pi OS (64-bit) and Debian, ubuntu for Ubuntu
docker_apt_distro: "{{ 'ubuntu' if ansible_distribution == 'Ubuntu' else 'debian' }}"
docker_apt_arch: "{{ {'aarch64': 'arm64', 'x86_64': 'amd64', 'armv7l': 'armhf'}[ansible_architecture] }}"
